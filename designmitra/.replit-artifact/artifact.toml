kind = "mobile"
previewPath = "/"
title = "DesignMitra"
version = "1.0.0"
id = "artifacts/designmitra"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 25559

[services.development]
run = "pnpm --filter @workspace/designmitra run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/designmitra", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/designmitra", "run", "serve" ]

[services.env]
PORT = "25559"
BASE_PATH = "/"
